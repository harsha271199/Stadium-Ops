name: Clean V11.8.6 staging
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-v1186-staging.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary deploy files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -d .deploy && git rm -r .deploy || true
          test -f .github/workflows/probe-v1186-payload.yml && git rm .github/workflows/probe-v1186-payload.yml || true
          git rm .github/workflows/cleanup-v1186-staging.yml
          git commit -m 'Clean temporary V11.8.6 deployment staging'
          git push origin main
