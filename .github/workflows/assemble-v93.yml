name: Assemble V9.3

on:
  push:
    branches:
      - deploy/v9-3-assembly

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate app
        shell: bash
        run: |
          set -euo pipefail
          cat .v93/part-000.b64 .v93/part-001.b64 .v93/part-002.b64 .v93/part-003.b64 .v93/part-004.b64 .v93/part-005.b64 .v93/tail-006-012.b64 | base64 -d | gzip -d > app/index.html
          echo "97b0caa3d198e0cba64d8b4929c23e6459d5ca936208b48eeecde28adc579e8d  app/index.html" | sha256sum -c -
          grep -F "2026-08-31-fixed-catalog-paper-print-preview-9-3" app/index.html
          python3 - <<'PY'
          import re, pathlib, subprocess, sys
          t = pathlib.Path('app/index.html').read_text()
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', t, re.S | re.I)
          js = '\\n'.join(s for s in scripts if s.strip())
          p = pathlib.Path('/tmp/check.js')
          p.write_text(js)
          r = subprocess.run(['node', '--check', str(p)])
          sys.exit(r.returncode)
          PY

      - name: Commit assembled frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          if git diff --cached --quiet; then
            echo "No app/index.html changes to commit"
            exit 0
          fi
          git commit -m "Assemble Stadium Ops V9.3 frontend"
          git push
