name: Finalize verified V9.3 frontend

on:
  push:
    branches:
      - deploy/v9-3-staging
    paths:
      - .github/workflows/finalize-v9-3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/v9-3-staging
          fetch-depth: 0
      - name: Repair exact damaged bytes and verify
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, lzma
          base=Path('deploy/v9_3_chunks')
          # part 006: exact correct 1000-character block at offset 9000
          correct006=''''''
          p6=base/'part_006'; s6=p6.read_text(); assert len(s6)==19000 and len(correct006)==1000
          p6.write_text(s6[:9000]+correct006+s6[10000:])
          # part 007: diagnostic isolated the corruption to exactly one character.
          p7=base/'part_007'; s7=p7.read_text(); assert len(s7)==19000
          assert s7.count('FnadyaglUu')==1
          p7.write_text(s7.replace('FnadyaglUu','FnadyiglUu',1))
          def gitsha(p):
              d=p.read_bytes(); return hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          assert gitsha(p6)=='fd552b3c9fc985ff276218cf06f75e11f7e97feb'
          assert gitsha(p7)=='4ff91e81c4d1c0b1546420a308363d456191d97d'
          b64=''.join((base/f'part_{i:03d}').read_text() for i in range(11))
          packed=base64.b64decode(b64)
          assert hashlib.sha256(packed).hexdigest()=='1e6a6bd70989b891a282663b7e89c230ed7bc0021758b72ee4a080a0524b3623'
          html=lzma.decompress(packed)
          assert hashlib.sha256(html).hexdigest()=='97b0caa3d198e0cba64d8b4929c23e6459d5ca936208b48eeecde28adc579e8d'
          assert b'2026-08-31-fixed-catalog-paper-print-preview-9-3' in html
          Path('app/index.html').write_bytes(html)
          print('VERIFIED V9.3 SHA256 97b0caa3d198e0cba64d8b4929c23e6459d5ca936208b48eeecde28adc579e8d')
      - name: Commit verified V9.3 to staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy/v9_3_chunks deploy/v9_3_READY
          rm -f .github/workflows/assemble-v9-3.yml .github/workflows/diagnose-v9-chunks.yml .github/workflows/diagnose-v9-p007.yml .github/workflows/repair-assemble-v9-3.yml .github/workflows/finalize-v9-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage verified Stadium Ops V9.3"
          git push origin HEAD:deploy/v9-3-staging
