name: Deploy Stadium Ops V11.8.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v11-8-6.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble and apply V11.8.6
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/v1186_00.b64 .deploy/v1186_01.b64 .deploy/v1186_02.b64 .deploy/v1186_03.b64 .deploy/v1186_04.b64 .deploy/v1186_05.b64 .deploy/v1186_06.b64 .deploy/v1186_07.b64 .deploy/v1186_08.b64 | base64 -d | xz -d > /tmp/v1186.patch
          git apply --check /tmp/v1186.patch
          git apply /tmp/v1186.patch

      - name: Validate production frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, collections
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          assert "const BUILD_TAG = '2026-09-03-stadium-ops-production-11-8-6';" in s
          assert 'ID 88000 · PIN 6400' not in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          js='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/v1186.js').write_text(js,encoding='utf-8')
          names=re.findall(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',js)
          dups={k:v for k,v in collections.Counter(names).items() if v>1}
          assert not dups, dups
          print('V11.8.6 validation PASS; functions',len(names))
          PY
          node --check /tmp/v1186.js

      - name: Bump app cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/sw.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const CACHE_VERSION = '[^']+';","const CACHE_VERSION = 'stadium-ops-v4-v11-8-6';",s,count=1)
          if n != 1:
              raise SystemExit('Could not find CACHE_VERSION in app/sw.js')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit production deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .deploy/v1186_*.b64
          git rm .github/workflows/deploy-v11-8-6.yml
          git add -A app/index.html app/sw.js .deploy
          git commit -m 'Deploy Stadium Ops V11.8.6'
          git push origin main
