name: Diagnose V9.3 part 007 block

on:
  push:
    branches:
      - deploy/v9-3-staging
    paths:
      - .github/workflows/diagnose-v9-p007.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/v9-3-staging
      - name: Hash 100-character sub-blocks
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          s=Path('deploy/v9_3_chunks/part_007').read_text()[6000:7000]
          for i in range(0,1000,100):
              b=s[i:i+100]
              print(f'{i//100}|{hashlib.sha256(b.encode()).hexdigest()}|{b}')
