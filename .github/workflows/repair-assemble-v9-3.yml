name: Repair and assemble V9.3 frontend

on:
  push:
    branches:
      - deploy/v9-3-staging
    paths:
      - .github/workflows/repair-assemble-v9-3.yml

permissions:
  contents: write

jobs:
  repair_assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/v9-3-staging
          fetch-depth: 0
      - name: Repair two blocks and verify V9.3
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, lzma
          fixes = {
            ('part_006', 9): '''''',
            ('part_007', 6): ''''''
          }
          base = Path('deploy/v9_3_chunks')
          for (name, block), correct in fixes.items():
              p = base / name
              s = p.read_text()
              assert len(s) == 19000
              assert len(correct) == 1000
              start = block * 1000
              s = s[:start] + correct + s[start+1000:]
              p.write_text(s)
          expected_parts = {
            'part_006':'fd552b3c9fc985ff276218cf06f75e11f7e97feb',
            'part_007':'4ff91e81c4d1c0b1546420a308363d456191d97d'
          }
          def git_blob_sha(data: bytes):
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for name, expected in expected_parts.items():
              got=git_blob_sha((base/name).read_bytes())
              print(name, got)
              assert got == expected
          b64 = ''.join((base/f'part_{i:03d}').read_text() for i in range(11))
          packed = base64.b64decode(b64)
          assert hashlib.sha256(packed).hexdigest() == '1e6a6bd70989b891a282663b7e89c230ed7bc0021758b72ee4a080a0524b3623'
          html = lzma.decompress(packed)
          assert hashlib.sha256(html).hexdigest() == '97b0caa3d198e0cba64d8b4929c23e6459d5ca936208b48eeecde28adc579e8d'
          assert b'2026-08-31-fixed-catalog-paper-print-preview-9-3' in html
          Path('app/index.html').write_bytes(html)
          print('V9.3 exact SHA verified')
      - name: Commit verified app to staging and clean payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy/v9_3_chunks deploy/v9_3_READY
          rm -f .github/workflows/assemble-v9-3.yml .github/workflows/diagnose-v9-chunks.yml .github/workflows/repair-assemble-v9-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage verified Stadium Ops V9.3"
          git push origin HEAD:deploy/v9-3-staging
