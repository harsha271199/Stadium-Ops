name: Diagnose V9.3 payload chunks

on:
  push:
    branches:
      - deploy/v9-3-staging
    paths:
      - .github/workflows/diagnose-v9-chunks.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/v9-3-staging
      - name: Hash 1000-character blocks
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          for name in ('part_006','part_007'):
              s=Path('deploy/v9_3_chunks/'+name).read_text()
              print(name, 'len', len(s))
              for i in range(0,len(s),1000):
                  b=s[i:i+1000].encode()
                  print(f'{name}|{i//1000:02d}|{hashlib.sha256(b).hexdigest()}')
