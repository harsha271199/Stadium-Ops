name: Hotfix warehouse delivery action

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-warehouse-delivery-v9-3-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch deployed Warehouse flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')

          replacements=[
          ("""        ? '🔴 URGENT request · Tap to start delivery'\n        : pending\n          ? '📥 Stock requested · Tap to start delivery'\n          : '🚚 Planned transfer · Tap to open';""",
           """        ? '🔴 URGENT · Tap to claim + start delivery'\n        : pending\n          ? '📥 Stock requested · Tap to claim + start delivery'\n          : '🚚 Planned transfer · Tap to open';"""),

          ("""    if (mergedAnything) {\n      renderTsItems();\n      if (_tsTransfer.status === 'pending') {\n        await sb('transfers?id=eq.'+_tsTransfer.id, { method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify({ status:'delivering' }) });\n        _tsTransfer.status = 'delivering';\n        renderTsStatus();\n      }\n    }""",
           """    if (mergedAnything) {\n      renderTsItems();\n      if (_tsTransfer.status === 'pending') {\n        await sb('transfers?id=eq.'+_tsTransfer.id, { method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify({ status:'delivering' }) });\n        _tsTransfer.status = 'delivering';\n      }\n      // Request items merge asynchronously after the screen first opens.\n      // If the initial transfer_items query was empty, Mark delivered was\n      // hidden and never restored for an already-delivering request.\n      renderTsStatus();\n    }"""),

          ("""  renderTsItems();\n  await sb('transfer_items?id=eq.'+id, { method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify({ delivered: it.delivered, qty_delivered: it.qty_delivered||0 }) });""",
           """  renderTsItems();\n  renderTsStatus();\n  await sb('transfer_items?id=eq.'+id, { method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify({ delivered: it.delivered, qty_delivered: it.qty_delivered||0 }) });"""),

          ("""  _tsItems = _tsItems.filter(i => i.id !== id);\n  renderTsItems();\n  toast('Removed ' + it.item_name);""",
           """  _tsItems = _tsItems.filter(i => i.id !== id);\n  renderTsItems();\n  renderTsStatus();\n  toast('Removed ' + it.item_name);"""),

          ("const BUILD_TAG = '2026-08-31-fixed-catalog-paper-print-preview-9-3';",
           "const BUILD_TAG = '2026-09-02-warehouse-delivery-action-hotfix-9-3-1';")
          ]

          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Expected deployed code not found; refusing partial hotfix:\n'+old[:180])
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
          Path('/tmp/index-check.js').write_text(js,encoding='utf-8')
          assert "renderTsItems();\n      // Request items merge asynchronously" not in s
          assert "renderTsStatus();" in s
          assert "Tap to claim + start delivery" in s
          PY
          node --check /tmp/index-check.js

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-warehouse-delivery-v9-3-1.yml
          git add app/index.html
          git commit -m 'Fix Warehouse claim and delivery action visibility'
          git push origin main
