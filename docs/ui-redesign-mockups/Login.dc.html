<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4FB8}a:hover{color:#163E91}
button,input,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:3px solid #F6C9D1;outline-offset:0;border-color:#C8102E}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; background: #F4F5F7; font-family: 'Public Sans', system-ui, sans-serif; color: #16181D">

  <div style="width: 100%; height: 6px; background: #C8102E"></div>

  <div style="width: 100%; max-width: 440px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 0">
    <span style="display: flex; align-items: center; gap: 10px">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #C8102E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10l8-6 8 6v10"/><path d="M9 20v-6h6v6"/></svg></span>
      <span style="display: flex; flex-direction: column; gap: 0">
        <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.01em">Stadium Ops</span>
        <span style="font-size: 12px; font-weight: 600; color: #5B6270">aramark · game day</span>
      </span>
    </span>
    <button aria-label="Light or dark mode" style="width: 44px; height: 44px; border: 1px solid #E3E5E9; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </div>

  <main style="flex: 1; width: 100%; max-width: 440px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px 16px 28px">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Sign in</h1>
      <p style="margin: 0; font-size: 16px; color: #5B6270">{{lead}}</p>
    </div>

    <section style="display: flex; flex-direction: column; gap: 16px; padding: 18px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 22px; box-shadow: 0 8px 24px rgba(22,24,29,0.06)">
      <div role="tablist" aria-label="Who is signing in" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F1F2F4; border-radius: 14px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
          <button role="tab" onClick="{{m.pick}}" aria-selected="{{m.on}}" style="{{m.style}}">
            <sc-if value="{{m.isEmp}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M8 17c.7-1.8 2.2-2.8 4-2.8s3.3 1 4 2.8"/></svg></sc-if>
            <sc-if value="{{m.isNpo}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c.6-3 3-5 6-5s5.4 2 6 5M14 15c.7-.3 1.4-.4 2-.4 3 0 5.4 2 6 5"/></svg></sc-if>
            <span>{{m.label}}</span>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{isEmp}}" hint-placeholder-val="{{ true }}">
        <form style="display: flex; flex-direction: column; gap: 14px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #3A3F48">Employee ID · last 5 digits
            <input inputmode="numeric" maxlength="5" autocomplete="off" placeholder="65764" value="{{id}}" onInput="{{onId}}" style="min-height: 56px; padding: 0 16px; border: 1px solid #C9CDD4; border-radius: 14px; font-size: 22px; font-weight: 700; letter-spacing: 0.12em; color: #16181D">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #3A3F48">Last name or PIN
            <input autocomplete="off" placeholder="e.g. Smith" style="min-height: 56px; padding: 0 16px; border: 1px solid #C9CDD4; border-radius: 14px; font-size: 18px; color: #16181D">
          </label>
          <sc-if value="{{hasHint}}" hint-placeholder-val="{{ false }}">
            <div style="{{hintStyle}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
              <span>{{hint}}</span>
            </div>
          </sc-if>
          <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 58px; border: 0; border-radius: 14px; background: #C8102E; color: #FFFFFF; font-size: 18px; font-weight: 800; cursor: pointer">Sign in
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </sc-if>

      <sc-if value="{{isNpo}}" hint-placeholder-val="{{ false }}">
        <form style="display: flex; flex-direction: column; gap: 14px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #3A3F48">Your group
            <div style="position: relative">
              <select style="width: 100%; min-height: 56px; padding: 0 44px 0 16px; border: 1px solid #C9CDD4; border-radius: 14px; font-size: 17px; font-weight: 600; color: #16181D; background: #FFFFFF; appearance: none">
                <option>Choose your group</option><option>Boosters Club</option><option>High School Band</option><option>Youth Soccer League</option>
              </select>
              <svg style="position: absolute; right: 16px; top: 19px; pointer-events: none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #3A3F48">Group PIN · 4 digits
            <input inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" style="min-height: 56px; padding: 0 16px; border: 1px solid #C9CDD4; border-radius: 14px; font-size: 22px; font-weight: 700; letter-spacing: 0.3em; color: #16181D">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #3A3F48">Your first and last name
            <input autocomplete="off" placeholder="As on your group’s list" style="min-height: 56px; padding: 0 16px; border: 1px solid #C9CDD4; border-radius: 14px; font-size: 18px; color: #16181D">
          </label>
          <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 58px; border: 0; border-radius: 14px; background: #C8102E; color: #FFFFFF; font-size: 18px; font-weight: 800; cursor: pointer">Sign in with group
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <span style="font-size: 13px; color: #5B6270; text-align: center">Your group leader has the PIN.</span>
        </form>
      </sc-if>
    </section>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 0 4px; font-size: 13px; color: #5B6270; line-height: 1.45">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>This app tracks your stand. Use the stadium clock-in machine for paid hours.</span>
    </div>
    <span class="num" style="text-align: center; font-size: 12px; color: #9AA0AA">2026-11-28-fix-174</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #16181D; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 7v7M9 11l3 3 3-3"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 800">Add the app to your phone</span><span style="font-size: 12px; opacity: .75">Opens faster and gets alerts</span></span>
      <button style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: #FFC72C; color: #16181D; font-size: 13px; font-weight: 800; cursor: pointer">Install</button>
      <button aria-label="Dismiss" style="width: 32px; height: 32px; border: 0; background: none; color: #FFFFFF; font-size: 18px; cursor: pointer">×</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { id: '', mode: 'emp' }; }
  renderVals() {
    const s = this.state, id = s.id;
    const H = { '60000': 'Warehouse: type your last name.', '70000': 'Premium: type your last name.', '90000': 'Managers: type your last name.' };
    const hint = H[id] || '';
    const modes = [['emp', 'Employee'], ['npo', 'NPO group']].map(([k, l]) => {
      const on = s.mode === k;
      return { label: l, on: on ? 'true' : 'false', isEmp: k === 'emp', isNpo: k === 'npo', pick: () => this.setState({ mode: k }),
        style: 'display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 0; border-radius: 11px; font-size: 15px; font-weight: 800; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #C8102E; box-shadow: 0 1px 3px rgba(22,24,29,0.14)' : 'background: transparent; color: #3A3F48') };
    });
    return { modes, isEmp: s.mode === 'emp', isNpo: s.mode === 'npo', id,
      lead: s.mode === 'emp' ? 'Start your shift with your ID and last name.' : 'Volunteer groups sign in with the group PIN.',
      onId: e => this.setState({ id: e.target.value.replace(/\D/g, '').slice(0, 5) }),
      hasHint: !!hint, hint,
      hintStyle: 'display: flex; gap: 8px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; line-height: 1.4; color: #163E91; background: #E6EDFB' };
  }
}
</script>
</body>
</html>
