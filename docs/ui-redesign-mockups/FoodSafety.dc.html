<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food Safety</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4FB8}a:hover{color:#163E91}
button,input{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
main > *, main > * > *{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5F7; font-family: 'Public Sans', system-ui, sans-serif; color: #16181D; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E3E5E9">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Lead.dc.html" aria-label="Back" style="width: 44px; height: 44px; border: 1px solid #E3E5E9; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 600; color: #C8102E">DFA 143 · today</span>
        <span style="font-size: 20px; font-weight: 800">Food Safety Log</span>
      </div>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button role="tab" onClick="{{t.pick}}" aria-selected="{{t.on}}" style="{{t.style}}">
          <span style="{{t.dot}}"></span>
          <span>{{t.label}}</span>
        </button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px">

    <sc-if value="{{isSan}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <section style="display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 16px">
          <span style="font-size: 15px; font-weight: 800">Sanitizer concentration</span>
          <span style="font-size: 13px; color: #5B6270">Target 150–400 ppm · test with QT-40 strips at 65–85°F</span>
          <div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden">
            <span style="width: 25%; background: #F3C9CF"></span><span style="width: 41.7%; background: #BFE3CB"></span><span style="width: 33.3%; background: #F3C9CF"></span>
          </div>
          <div class="num" style="display: flex; justify-content: space-between; font-size: 11px; color: #5B6270"><span>0</span><span>150</span><span>400</span><span>600 ppm</span></div>
        </section>
        <sc-for list="{{readings}}" as="r" hint-placeholder-count="3">
          <section style="{{r.cardStyle}}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="font-size: 15px; font-weight: 800">{{r.label}}</span>
              <span style="{{r.chipStyle}}">{{r.status}}</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5B6270">Time
                <input value="{{r.time}}" style="min-height: 48px; padding: 0 12px; border: 1px solid #D5D8DE; border-radius: 12px; font-size: 16px; color: #16181D">
              </label>
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5B6270">Reading (ppm)
                <input inputmode="numeric" value="{{r.ppm}}" onInput="{{r.onPpm}}" placeholder="e.g. 200" style="min-height: 48px; padding: 0 12px; border: 1px solid #D5D8DE; border-radius: 12px; font-size: 16px; color: #16181D">
              </label>
            </div>
            <sc-if value="{{r.needFix}}" hint-placeholder-val="{{ false }}">
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #8E0E22">Corrective action (required when out of range)
                <input placeholder="e.g. Remixed sanitizer, retested at 200" style="min-height: 48px; padding: 0 12px; border: 1px solid #F3C9CF; border-radius: 12px; font-size: 16px; color: #16181D">
              </label>
            </sc-if>
          </section>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; color: #5B6270">{{listHint}}</span>
        <sc-for list="{{list}}" as="it" hint-placeholder-count="3">
          <section style="{{it.cardStyle}}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-size: 15px; font-weight: 800">{{it.name}}</span>
                <span style="font-size: 12px; color: #5B6270">{{it.target}}</span>
              </span>
              <button aria-label="Remove" style="width: 40px; height: 40px; border: 1px solid #E3E5E9; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5B6270">Time
                <input value="{{it.time}}" style="min-height: 48px; padding: 0 12px; border: 1px solid #D5D8DE; border-radius: 12px; font-size: 16px; color: #16181D">
              </label>
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5B6270">Temp (°F)
                <input inputmode="numeric" value="{{it.temp}}" style="min-height: 48px; padding: 0 12px; border: 1px solid #D5D8DE; border-radius: 12px; font-size: 16px; color: #16181D">
              </label>
            </div>
            <span style="{{it.chipStyle}}">{{it.status}}</span>
          </section>
        </sc-for>
        <button style="min-height: 52px; border: 1px dashed #B9BEC7; border-radius: 14px; background: #FFFFFF; color: #16181D; font-size: 15px; font-weight: 700; cursor: pointer">{{addLabel}}</button>
      </div>
    </sc-if>

    <button style="min-height: 56px; border: 0; border-radius: 14px; background: #C8102E; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">{{saveLabel}}</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'san', ppm: { a: '200', b: '120', c: '' } }; }
  renderVals() {
    const s = this.state;
    const chip = (c, b) => 'font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; align-self: flex-start; color: ' + c + '; background: ' + b;
    const OK = chip('#166534', '#E8F5EC'), BAD = chip('#8E0E22', '#FDECEE'), TODO = chip('#3A3F48', '#EEF0F3');
    const card = st => 'display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #FFFFFF; border-radius: 16px; ' + (st === 'bad' ? 'border: 2px solid #B4122B' : 'border: 1px solid #E3E5E9');
    const R = [['a', 'Set up · before opening', '4:35 PM'], ['b', 'Mid-day · halftime', '7:02 PM'], ['c', 'Close · end of game', '']];
    const readings = R.map(([k, label, time]) => {
      const v = parseFloat(s.ppm[k]);
      const st = isNaN(v) ? 'todo' : v < 150 ? 'bad' : v > 400 ? 'bad' : 'ok';
      return { label, time, ppm: s.ppm[k], needFix: st === 'bad',
        status: st === 'todo' ? 'Not taken' : st === 'ok' ? 'In range' : (v < 150 ? 'Too low' : 'Too high'),
        chipStyle: st === 'ok' ? OK : st === 'bad' ? BAD : TODO, cardStyle: card(st),
        onPpm: e => this.setState({ ppm: { ...s.ppm, [k]: e.target.value } }) };
    });
    const L = {
      units: { hint: 'Every fridge and freezer at this stand. Fridge 41°F or below · freezer 0°F or below.', add: 'Add a fridge or freezer', items: [
        { name: 'Reach-in fridge 1', target: '41°F or below', time: '4:40 PM', temp: '38', ok: true },
        { name: 'Under-counter fridge', target: '41°F or below', time: '4:40 PM', temp: '44', ok: false },
        { name: 'Freezer', target: '0°F or below', time: '4:41 PM', temp: '-2', ok: true }] },
      cook: { hint: 'Internal temperature when cooked. Pick from this stand’s items.', add: 'Add a cooked item', items: [
        { name: 'Chicken Tenders', target: '165°F or above', time: '5:20 PM', temp: '171', ok: true },
        { name: 'Hamburger', target: '155°F or above', time: '5:24 PM', temp: '158', ok: true }] },
      hold: { hint: 'Food kept warm or cold for sale. Hot 135°F or above · cold 41°F or below.', add: 'Add a held item', items: [
        { name: 'Hot Dogs (roller)', target: 'Hot · 135°F or above', time: '6:00 PM', temp: '141', ok: true },
        { name: 'Nacho cheese', target: 'Hot · 135°F or above', time: '', temp: '', ok: null }] }
    };
    const cur = L[s.tab];
    const list = cur ? cur.items.map(i => ({ ...i, status: i.ok === null ? 'Not checked' : i.ok ? 'OK' : 'Out of range · fix and recheck', chipStyle: i.ok === null ? TODO : i.ok ? OK : BAD, cardStyle: card(i.ok === false ? 'bad' : 'ok') })) : [];
    const tabState = { san: readings.some(r => r.needFix) ? 'bad' : readings.some(r => r.status === 'Not taken') ? 'todo' : 'ok', units: 'bad', cook: 'ok', hold: 'todo' };
    const dotC = { ok: '#16A34A', bad: '#B4122B', todo: '#D97706' };
    const tabs = [['san', 'Sanitizer'], ['units', 'Fridge'], ['cook', 'Cooking'], ['hold', 'Holding']].map(([k, l]) => {
      const on = s.tab === k;
      return { label: l, on: on ? 'true' : 'false', pick: () => this.setState({ tab: k }),
        dot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + dotC[tabState[k]],
        style: 'display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #16181D; color: #FFFFFF; border: 1px solid #16181D' : 'background: #FFFFFF; color: #16181D; border: 1px solid #D5D8DE') };
    });
    const saveL = { san: 'Save sanitizer log', units: 'Save fridge & freezer temps', cook: 'Save cooking temps', hold: 'Save holding temps' };
    return { tabs, isSan: s.tab === 'san', isList: s.tab !== 'san', readings, list, listHint: cur ? cur.hint : '', addLabel: cur ? cur.add : '', saveLabel: saveL[s.tab] };
  }
}
</script>
</body>
</html>
