<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manager home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4FB8}a:hover{color:#163E91}
button,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
main > *, main > * > *{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5F7; font-family: 'Public Sans', system-ui, sans-serif; color: #16181D; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E3E5E9">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.01em">aramark <span style="color: #C8102E">·</span> <span style="font-size: 14px; font-weight: 700; color: #C8102E">{{roleLabel}}</span></span>
      <div style="display: flex; gap: 8px">
        <button aria-label="Light or dark mode" style="width: 44px; height: 44px; border: 1px solid #E3E5E9; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
        <button aria-label="Sign out" style="width: 44px; height: 44px; border: 1px solid #E3E5E9; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg></button>
      </div>
    </div>
    <div role="group" aria-label="Mockup: view as" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #EEF0F3; border-radius: 12px">
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="2">
        <button onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="{{r.style}}">{{r.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px">

    <section style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #7A0F22; color: #FFFFFF; border-radius: 18px">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 12px; font-weight: 700; color: #F6C9D1">Game day · Mountain America</span>
        <span style="font-size: 17px; font-weight: 800">Football · Sat, Nov 29</span>
        <span class="num" style="font-size: 13px; color: #FBE3E7">Gates 4:30 · kickoff 6:00 PM</span>
      </span>
      <button style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #FFC72C; color: #16181D; font-size: 14px; font-weight: 800; cursor: pointer">Details</button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 16px">
      <span style="font-size: 20px; font-weight: 800">{{name}}</span>
      <span style="align-self: flex-start; font-size: 12px; font-weight: 800; color: #8E0E22; background: #FDECEE; padding: 5px 10px; border-radius: 999px">{{roleLabel}}</span>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #E3E5E9; border-radius: 12px">
        <label for="mws" style="font-size: 12px; font-weight: 700; color: #5B6270">Working stand</label>
        <div style="position: relative">
          <select id="mws" style="width: 100%; min-height: 48px; padding: 0 40px 0 12px; border: 1px solid #D5D8DE; border-radius: 12px; background: #FFFFFF; color: #16181D; font-size: 16px; font-weight: 700; appearance: none">
            <option>216M Fan Fuel BevMKT</option><option>204 Pitchfork Pizza</option><option>212P Beer Portable</option><option>219 Cold Beer Cheeseburgers</option>
          </select>
          <svg style="position: absolute; right: 12px; top: 15px; pointer-events: none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </section>

    <sc-if value="{{isMgr}}" hint-placeholder-val="{{ true }}">
      <button style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 16px; cursor: pointer; text-align: left">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #F3EAFB; color: #5B2A86; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 800; color: #16181D">Game-Day Feedback</span>
          <span style="font-size: 13px; color: #5B6270">Compliment, concern, or issue</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </button>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; min-height: 150px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 16px; cursor: pointer; text-align: left">
          <span style="{{t.iconStyle}}">
            <sc-if value="{{t.isChecks}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M9 11l2 2 4-4M9 17h6"/></svg></sc-if>
            <sc-if value="{{t.isReq}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></sc-if>
            <sc-if value="{{t.isFood}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14V5a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0z"/><path d="M12 10v6"/></svg></sc-if>
            <sc-if value="{{t.isTeam}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.3 4.4 2.1 5 5.4"/></svg></sc-if>
          </span>
          <span style="font-size: 17px; font-weight: 800; color: #16181D">{{t.title}}</span>
          <span style="font-size: 13px; color: #5B6270; line-height: 1.35">{{t.sub}}</span>
          <span class="num" style="{{t.tagStyle}}">{{t.tag}}</span>
        </button>
      </sc-for>
    </div>

    <span style="margin-top: 8px; font-size: 13px; font-weight: 800; color: #5B6270">{{sectionLabel}}</span>
    <sc-for list="{{rows}}" as="w" hint-placeholder-count="5">
      <button onClick="{{w.tap}}" style="display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 16px; cursor: pointer; text-align: left">
        <span style="{{w.iconStyle}}">
          <sc-if value="{{w.isBox}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/><path d="M7.5 5.5l9 5"/></svg></sc-if>
          <sc-if value="{{w.isQr}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v7h-7"/></svg></sc-if>
          <sc-if value="{{w.isLive}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></sc-if>
          <sc-if value="{{w.isStatus}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></sc-if>
          <sc-if value="{{w.isTools}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg></sc-if>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-size: 16px; font-weight: 800; color: #16181D">{{w.title}}</span>
          <span style="font-size: 13px; color: #5B6270">{{w.sub}}</span>
        </span>
        <sc-if value="{{w.hasTag}}" hint-placeholder-val="{{ true }}"><span class="num" style="{{w.tagStyle}}">{{w.tag}}</span></sc-if>
        <sc-if value="{{w.isTools}}" hint-placeholder-val="{{ false }}"><span style="{{toolsChev}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></sc-if>
      </button>
      <sc-if value="{{w.showTools}}" hint-placeholder-val="{{ false }}">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: -4px">
          <sc-for list="{{toolItems}}" as="ti" hint-placeholder-count="6">
            <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 76px; padding: 10px 12px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 12px; cursor: pointer; text-align: left">
              <span style="display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 6px">
                <span style="font-size: 14px; font-weight: 800; color: #16181D">{{ti.label}}</span>
                <sc-if value="{{ti.hasN}}" hint-placeholder-val="{{ false }}"><span class="num" style="{{ti.nStyle}}">{{ti.n}}</span></sc-if>
              </span>
              <span style="font-size: 12px; color: #5B6270; line-height: 1.3">{{ti.sub}}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </sc-for>
    <button style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; background: #FFFFFF; border: 1px dashed #B9BEC7; border-radius: 16px; cursor: pointer; text-align: left">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #F3EAFB; color: #5B2A86; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6V4h8v2"/><rect x="5" y="6" width="14" height="14" rx="6"/><path d="M12 10v6M5 12H2M22 12h-3M6 18l-2 2M18 18l2 2"/></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 800; color: #16181D">Report an app problem</span>
        <span style="font-size: 13px; color: #5B6270">{{fbSub}}</span>
      </span>
    </button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { role: 'mgr', tools: false }; }
  renderVals() {
    const s = this.state, isAdm = s.role === 'adm', isMgr = s.role === 'mgr' || isAdm;
    const tone = { ok: 'color: #166534; background: #E8F5EC', warn: 'color: #8A4205; background: #FDF1E3', bad: 'color: #8E0E22; background: #FDECEE', info: 'color: #163E91; background: #E6EDFB' };
    const tag = (t, auto) => 'font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; ' + (auto ? 'margin-top: auto; ' : '') + tone[t];
    const icon = (c, b, sz) => 'width: ' + (sz || 44) + 'px; height: ' + (sz || 44) + 'px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: ' + c + '; background: ' + b;
    const roles = [['mgr', 'Manager'], ['sup', 'Support mgr'], ['adm', 'Admin']].map(([k, l]) => {
      const on = s.role === k;
      return { label: l, on: on ? 'true' : 'false', pick: () => this.setState({ role: k, tools: false }),
        style: 'min-height: 40px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #16181D; box-shadow: 0 1px 2px rgba(22,24,29,0.12)' : 'background: transparent; color: #3A3F48') };
    });
    const tiles = [
      { title: 'Checks', sub: 'Opening · Count In · During · Count Out · Closing', tag: '4 stands missing', tagStyle: tag('bad', true), isChecks: true, iconStyle: icon('#163E91', '#E6EDFB') },
      { title: 'Requests', sub: 'Stock · Force Stock · Food · IT', tag: '9 late', tagStyle: tag('bad', true), isReq: true, iconStyle: icon('#C8102E', '#FDECEE') },
      { title: 'Food Safety', sub: 'Temps · Sanitizer · Holding', tag: '7 temps due', tagStyle: tag('warn', true), isFood: true, iconStyle: icon('#8A4205', '#FDF1E3') },
      { title: 'My Team', sub: 'Active · Present/Absent · Breaks · all stands', tag: '212 of 231 here', tagStyle: tag('warn', true), isTeam: true, iconStyle: icon('#166534', '#E8F5EC') }
    ];
    const all = [
      { title: 'Checkout & Inventory Tracker', sub: 'Count In / Count Out · boxes received at the exit', tag: '18 of 26 in', tagStyle: tag('warn'), isBox: true, iconStyle: icon('#8A4205', '#FDF1E3'), mgrOnly: true },
      { title: 'Sign-in help & QR', sub: 'App QR · what each subcontractor stand types to sign in', tag: 'QR', tagStyle: tag('info'), isQr: true, iconStyle: icon('#163E91', '#E6EDFB') },
      { title: 'All Stands Live', sub: 'Who’s working at every stand', tag: '212 working', tagStyle: tag('ok'), isLive: true, iconStyle: icon('#166534', '#E8F5EC') },
      { title: 'Stand Status', sub: 'Checks · Inventory · Food Safety · tap missing work', tag: '6 missing', tagStyle: tag('bad'), isStatus: true, iconStyle: icon('#8E0E22', '#FDECEE') },
      { title: isAdm ? 'Manager Tools & Admin Setup' : 'Manager Tools', sub: isAdm ? 'Inventory · Reports · Refunds · Access · Uploads' : 'Inventory · Reports · Time sheet · Refunds · Maintenance', isTools: true, iconStyle: icon('#3A3F48', '#EEF0F3') }
    ];
    const rows = all.filter(r => isMgr || !r.mgrOnly).map(r => ({ ...r, hasTag: !!r.tag, isTools: !!r.isTools, isBox: !!r.isBox, isQr: !!r.isQr, isLive: !!r.isLive, isStatus: !!r.isStatus,
      showTools: !!r.isTools && s.tools, tap: r.isTools ? () => this.setState({ tools: !s.tools }) : () => {} }));
    const nS = t => 'font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 999px; ' + tone[t];
    const toolItems = [
      { label: 'Inventory', sub: 'Counts · print · ledger', hasN: false },
      { label: 'Transfers', sub: 'Review transfer status', hasN: true, n: '20 pending', nStyle: nS('warn') },
      { label: 'Reports', sub: 'Feedback · checklists', hasN: false },
      { label: 'Time sheet', sub: 'Breaks · tip export · Premium', hasN: false },
      { label: 'Refunds', sub: 'Supervisor completions · records', hasN: true, n: '8', nStyle: nS('bad'), mgr: true },
      { label: 'Maintenance', sub: 'Open facility issues', hasN: true, n: '1', nStyle: nS('warn') },
      { label: 'Runner coverage', sub: 'Who covers each stand', hasN: false },
      { label: 'Admin Setup', sub: 'Access · assignments · game info · uploads', hasN: false, adm: true }
    ].filter(t => (isMgr || !t.mgr) && (isAdm || !t.adm));
    return { roles, isMgr, fbSub: 'Something broken, slow or confusing? Tell us.', roleLabel: isAdm ? 'Admin' : isMgr ? 'Manager' : 'Support manager', name: isAdm ? 'Admin account' : isMgr ? 'Manager, Mia' : 'Helper, Hank',
      sectionLabel: (isAdm ? 'Admin' : isMgr ? 'Manager' : 'Support manager') + ' · all stands', tiles, rows, toolItems,
      toolsChev: 'display: flex; transform: rotate(' + (s.tools ? 180 : 0) + 'deg)' };
  }
}
</script>
</body>
</html>
